<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf Handicap Calculator</title>
    <meta
      name="description"
      content="Track rounds and compute your World Handicap Index in the browser. Private, local-first scoring record."
    />
    <script>
      (function () {
        try {
          var k = "golf-handicap-theme";
          var t = localStorage.getItem(k);
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
          else document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="icon" href="./images/logo.svg" type="image/svg+xml" sizes="any" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="landing">
    <div class="page">
      <div class="theme-bar" role="toolbar" aria-label="Display theme">
        <div class="theme-bar-right">
          <span class="theme-label">Theme</span>
          <div class="theme-switch" role="group" aria-label="Choose light or dark theme">
            <button type="button" class="theme-opt" id="theme-opt-dark" data-theme-value="dark" aria-pressed="true">
              Dark
            </button>
            <button type="button" class="theme-opt" id="theme-opt-light" data-theme-value="light" aria-pressed="false">
              Light
            </button>
          </div>
        </div>
      </div>

      <main class="landing-wrap">
        <div class="landing-inner">
          <img
            class="landing-logo"
            src="./images/logo.svg"
            width="96"
            height="96"
            alt="Golf Handicap Calculator"
            decoding="async"
          />
          <p class="landing-kicker">World Handicap System</p>
          <h1 class="landing-title">Golf Handicap <span>Calculator</span></h1>
          <p class="landing-lede">
            A calm place to log rounds, pull course ratings when you want them, and watch your index come together—
            all in your browser, nothing on a server unless you host the files.
          </p>
          <div class="landing-actions">
            <a class="landing-cta" href="./app.html">Open calculator</a>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./js/landing.js"></script>
  </body>
</html>
